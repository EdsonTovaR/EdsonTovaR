name: Generate Snake Animation

# Cuándo se ejecuta esta acción:
on:
  # Se ejecuta automáticamente cada 24 horas a medianoche
  schedule:
    - cron: "0 0 * * *" 
  # Permite ejecutarlo manualmente desde la pestaña de Actions
  workflow_dispatch:
  # Se ejecuta cada vez que haces push a la rama principal (main o master)
  push:
    branches:
    - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Genera la serpiente a partir del grid de contribuciones del usuario
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Sube los archivos generados a una rama llamada 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
